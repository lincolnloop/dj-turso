[dependency-groups]
dev = [
  "beautifulsoup4==4.15.0",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest-env==1.8.5",
  "pytest==9.2.0",
]

[project]
dependencies = [
  "dj-turso[serverless]",
  "django-debug-toolbar==8.0.0",
  "django==6.1.3",
]
name = "dj-turso-example-polls"
requires-python = ">=3.12"
version = "0"

[tool.coverage.run]
branch = true
source_dirs = ["polls", "tests"]

[tool.uv]
exclude-newer = "7 days"

# Turso is exempt, in both places (see renovate.json): its releases carry the upstream
# fixes dj-turso waits on.
[tool.uv.exclude-newer-package]
pyturso = "0 days"
turso-serverless = "0 days"

# dj-turso from the local checkout (repo root), so the example runs this branch's
# code, not a released version.
[tool.uv.sources]
dj-turso = { path = "../..", editable = true }
