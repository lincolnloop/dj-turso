[tox]
requires =
    tox>=4.22
    tox-uv>=1.16
env_list =
    py3{12,15}-django61
    dev
    py312-django61-mypy

[testenv]
runner = uv-venv-runner
dependency_groups = dev
deps =
    django61: django>=6.1,<6.2
uv_resolution =
    py312: lowest-direct
    py3{13,14,15}: highest
pass_env =
    DJ_TURSO_*
    PYTEST_XDIST_AUTO_NUM_WORKERS
    TURSO_*
# `-n auto` because xdist reads PYTEST_XDIST_AUTO_NUM_WORKERS for `auto` alone: CI pins 2,
# a workstation sets its own. Here rather than a suite's addopts so bare pytest stays serial.
commands =
    !mypy: pytest tests/core -n auto {posargs}
    !mypy: pytest tests/tooling -n auto {posargs}
    mypy: mypy .

[testenv:dev]
base_python = py315
runner = uv-venv-lock-runner
commands =
    pytest tests/core -n auto {posargs}
    pytest tests/tooling -n auto {posargs}
