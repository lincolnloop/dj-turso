---
name: test

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  # Abort pending builds if there's an update.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox:
    name: ${{ matrix.name || matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - py312-django61
          - py315-django61
          - dev
          - vendor-sqlite
          - vendor-pyturso
        # Named for the resolution, not the Python, so a required check survives a
        # Python bump.
        include:
          - env: py312-django61-mypy
            name: mypy-lowest
          - env: py315-django61-mypy
            name: mypy-highest
    # The dev job runs the Cloud tests on a database every branch shares, so one runs
    # at a time across branches; every other job's group is its own.
    concurrency:
      group: >-
        ${{ matrix.env == 'dev' && 'turso-cloud'
        || format('{0}-{1}', github.run_id, matrix.env) }}
      cancel-in-progress: false
    env:
      # Worker count for tox's `-n auto`; a runner has more cores than the suites
      # profitably use, and 2 is enough to keep the parallel path exercised.
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history + tags so hatch-vcs can derive the version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Run tox
        run: uvx --with tox-uv tox -e "${{ matrix.env }}"
        # One job only: the Cloud database is shared, and the tests lock it only
        # within a runner. Without the secrets, as on a fork, the Cloud tests skip.
        env:
          TURSO_DATABASE_URL: >-
            ${{ matrix.env == 'dev' && secrets.TURSO_DATABASE_URL || '' }}
          TURSO_AUTH_TOKEN: >-
            ${{ matrix.env == 'dev' && secrets.TURSO_AUTH_TOKEN || '' }}
      - name: Upload coverage to Codecov
        if: ${{ (success() || failure()) && !contains(matrix.env, 'mypy') }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.env }}
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ (success() || failure()) && !contains(matrix.env, 'mypy') }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: ${{ matrix.env }}
          fail_ci_if_error: true
          files: ${{ startsWith(matrix.env, 'vendor-')
            && format('junit-{0}.xml', matrix.env)
            || 'junit-core.xml,junit-tooling.xml' }}

  examples:
    name: examples/${{ matrix.example }} pytest suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - polls
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history + tags so hatch-vcs can derive the version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Run the suite
        run: uv run pytest
      - name: Write the coverage XML from the repo root
        if: ${{ success() || failure() }}
        # coverage names files relative to where it runs:
        # examples/<name>/polls/views.py, not a bare polls/views.py.
        working-directory: .
        env:
          EXAMPLE: examples/${{ matrix.example }}
        run: >-
          uv run --project $EXAMPLE coverage xml
          --rcfile=$EXAMPLE/pyproject.toml --data-file=$EXAMPLE/.coverage
          -o $EXAMPLE/coverage.xml
      - name: Upload coverage to Codecov
        if: ${{ success() || failure() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: examples-${{ matrix.example }}
          fail_ci_if_error: true
          files: examples/${{ matrix.example }}/coverage.xml
      - name: Upload test results to Codecov
        if: ${{ success() || failure() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: examples-${{ matrix.example }}
          fail_ci_if_error: true
          files: examples/${{ matrix.example }}/junit-examples-${{ matrix.example }}.xml

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history + tags so hatch-vcs can derive the version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Build sdist + wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
