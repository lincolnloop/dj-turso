# Upstream facts dj-turso relies on or works around. One [[assumption]] per fact:
# name, where (the dj_turso files that rely on it), evidence (an upstream doc or
# source URL), and either test (the node id that fails once the fact stops holding)
# or manual (what to re-check by hand) with verified (date and version last
# confirmed). Tests fail both ways: a fact lost breaks dj-turso, a fact gained means
# its workaround can go.

[[assumption]]
evidence = "https://github.com/tursodatabase/turso/blob/v0.8.4/COMPAT.md"
name = "Turso date functions know no time zone names"
test = "tests/core/test_turso_assumptions.py::test_turso_answers[date-functions-know-no-time-zones]"
where = ["dj_turso/operations.py"]

