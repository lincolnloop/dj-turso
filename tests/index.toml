[[cause]]
issue = "TBD"
kind = "upstream-bug"
name = "PRAGMA foreign_keys=OFF honored inside a transaction"
reason = "SQLite ignores PRAGMA foreign_keys inside a transaction; Turso applies it, so Django sees constraint checks disabled where it expects them still on"
tests = [
  "tests/vendor/django/backends/sqlite/tests.py::SchemaTests::test_constraint_checks_disabled_atomic_allowed",
  "tests/vendor/django/backends/sqlite/tests.py::SchemaTests::test_disable_constraint_checking_failure_disallowed",
  "tests/vendor/django/fixtures/tests.py::FixtureLoadingTests::test_loaddata_error_message",
]

[[cause]]
issue = "TBD"
kind = "upstream-bug"
name = "case-only RENAME COLUMN"
reason = "Turso rejects renaming a column to a name differing only in case as a duplicate column"
tests = [
  "tests/vendor/django/migrations/test_operations.py::OperationTests::test_rename_field_case",
]

[[cause]]
kind = "pending"
name = "foreign_key_check is a no-op"
reason = "Turso accepts PRAGMA foreign_key_check but returns no rows, so Django's constraint check never reports a dangling foreign key"
