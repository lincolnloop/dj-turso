# Known gaps on pyturso, applied by tests/conftest.py. One [[cause]] per reason:
# name, kind (pending | unsupported | upstream-bug | stdlib-internal), reason,
# issue (upstream-bug), tests (node ids or class/module prefixes).

[[cause]]
kind = "unsupported"
name = "time zone conversion"
reason = "Turso's date functions know no time zones beyond UTC and the system's local time, so dj-turso cannot convert stored datetimes to another time zone and raises NotSupportedError"
tests = [
  "tests/vendor/django/datetimes/tests.py::DateTimesTests::test_21432",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionWithTimeZoneTests::test_extract_func_explicit_timezone_priority",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionWithTimeZoneTests::test_extract_func_with_timezone",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionWithTimeZoneTests::test_extract_func_with_timezone_minus_no_offset",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionWithTimeZoneTests::test_trunc_func_with_timezone",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionWithTimeZoneTests::test_trunc_timezone_applied_before_truncation",
  "tests/vendor/django/model_fields/test_datetimefield.py::DateTimeFieldTests::test_lookup_date_with_use_tz",
  "tests/vendor/django/timezones/tests.py::NewDatabaseTests::test_query_convert_timezones",
  "tests/vendor/django/timezones/tests.py::NewDatabaseTests::test_query_datetime_lookups",
  "tests/vendor/django/timezones/tests.py::NewDatabaseTests::test_query_datetimes",
]

[[cause]]
kind = "pending"
name = "asserts Django's function names in SQL"
reason = "Counts 'extract' in the query text, where Django's sqlite3 backend names its django_*_extract UDFs; dj-turso's native SQL has no such name. The behavior asserted before it passes"
tests = [
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionTests::test_extract_year_exact_lookup",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionTests::test_extract_year_greaterthan_lookup",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionTests::test_extract_year_lessthan_lookup",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionWithTimeZoneTests::test_extract_year_exact_lookup",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionWithTimeZoneTests::test_extract_year_greaterthan_lookup",
  "tests/vendor/django/db_functions/datetime/test_extract_trunc.py::DateFunctionWithTimeZoneTests::test_extract_year_lessthan_lookup",
]

[[cause]]
kind = "unsupported"
name = "hash functions"
reason = "Turso has no MD5 or SHA functions, so dj-turso raises NotSupportedError for MD5, SHA1, SHA224, SHA256, SHA384 and SHA512"
tests = [
  "tests/vendor/django/db_functions/text/test_md5.py::MD5Tests::test_basic",
  "tests/vendor/django/db_functions/text/test_md5.py::MD5Tests::test_transform",
  "tests/vendor/django/db_functions/text/test_sha1.py::SHA1Tests::test_basic",
  "tests/vendor/django/db_functions/text/test_sha1.py::SHA1Tests::test_transform",
  "tests/vendor/django/db_functions/text/test_sha224.py::SHA224Tests::test_basic",
  "tests/vendor/django/db_functions/text/test_sha224.py::SHA224Tests::test_transform",
  "tests/vendor/django/db_functions/text/test_sha256.py::SHA256Tests::test_basic",
  "tests/vendor/django/db_functions/text/test_sha256.py::SHA256Tests::test_transform",
  "tests/vendor/django/db_functions/text/test_sha384.py::SHA384Tests::test_basic",
  "tests/vendor/django/db_functions/text/test_sha384.py::SHA384Tests::test_transform",
  "tests/vendor/django/db_functions/text/test_sha512.py::SHA512Tests::test_basic",
  "tests/vendor/django/db_functions/text/test_sha512.py::SHA512Tests::test_transform",
]

[[cause]]
kind = "stdlib-internal"
name = "stdlib sqlite3 limit API"
reason = "Reads or lowers limits through the stdlib sqlite3 Connection.getlimit()/setlimit(), which Turso drivers do not have; dj-turso uses SQLite's default limits as constants"
tests = [
  "tests/vendor/django/backends/sqlite/test_features.py::FeaturesTests::test_max_query_params_respects_variable_limit",
  "tests/vendor/django/backends/sqlite/test_operations.py::SQLiteOperationsTests::test_bulk_batch_size_respects_variable_limit",
  "tests/vendor/django/backends/sqlite/tests.py::LastExecutedQueryTest::test_parameter_count_exceeds_variable_or_column_limit",
]

[[cause]]
kind = "stdlib-internal"
name = "stdlib backend display name"
reason = "Asserts the stdlib backend's display name 'SQLite' in the version error; dj-turso's display name is 'Turso'"
tests = [
  "tests/vendor/django/backends/sqlite/tests.py::Tests::test_check_database_version_supported",
]

[[cause]]
kind = "stdlib-internal"
name = "stdlib backend rejects negative ROUND precision"
reason = "Asserts the ValueError Django's sqlite3 backend raises for a negative ROUND precision; dj-turso rounds left of the decimal point in SQL"
tests = [
  "tests/vendor/django/db_functions/math/test_round.py::RoundTests::test_unsupported_negative_precision",
]

[[cause]]
kind = "stdlib-internal"
name = "in-memory test database never closes"
reason = "Relies on the in-memory SQLite test database Django's sqlite3 backend uses by default; Turso test databases are files, and closing the shared connection mid-test breaks every later test in the process"
tests = [
  "tests/vendor/django/backends/sqlite/tests.py::ThreadSharing::test_database_sharing_in_threads",
]

